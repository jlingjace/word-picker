<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语口语抽词器 · Taboo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4ece0;
    --ink:#2b2520;
    --accent:#e0603a;
    --accent-deep:#c54a26;
    --teal:#1f6b5c;
    --card:#fffaf2;
    --shadow:rgba(43,37,32,.18);
    --muted:#7a6e5f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Fraunces',serif;
    background:var(--paper);
    background-image:radial-gradient(circle at 20% 15%, rgba(224,96,58,.07), transparent 45%),
                     radial-gradient(circle at 85% 80%, rgba(31,107,92,.08), transparent 45%);
    color:var(--ink);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:24px 16px 48px;
    overflow-x:hidden;
  }
  header{text-align:center;margin-bottom:6px;}
  h1{font-size:clamp(24px,5vw,38px);font-weight:900;letter-spacing:-.5px;line-height:1;}
  h1 .en{color:var(--accent);font-style:italic;}
  .sub{
    font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--teal);margin-top:9px;
  }

  /* ---------- 筛选栏 ---------- */
  .filters{width:min(620px,100%);margin:20px 0 4px;}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
  .filter-label{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-right:4px;min-width:48px;
  }
  .chip{
    font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;
    border:2px solid var(--ink);border-radius:20px;padding:5px 12px;background:var(--card);
    color:var(--ink);transition:all .1s ease;user-select:none;white-space:nowrap;
  }
  .chip:hover{transform:translateY(-1px);}
  .chip.on{background:var(--ink);color:var(--paper);}
  .chip.lvl.on{background:var(--teal);border-color:var(--teal);}

  /* ---------- 卡片 ---------- */
  .stage{margin:14px 0 8px;width:min(620px,100%);}
  .card{
    position:relative;background:var(--card);border:3px solid var(--ink);
    border-radius:22px;box-shadow:10px 12px 0 var(--shadow);
    padding:40px 28px 34px;min-height:220px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .card.pop{animation:pop .35s cubic-bezier(.2,1.4,.5,1);}
  @keyframes pop{0%{transform:scale(.9) rotate(-1.5deg);opacity:.4;}100%{transform:scale(1) rotate(0);opacity:1;}}

  .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;min-height:22px;}
  .badge{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;
    padding:3px 9px;border-radius:6px;border:1.5px solid var(--ink);
  }
  .badge.theme{background:rgba(31,107,92,.12);color:var(--teal);border-color:var(--teal);}
  .badge.lvl{background:rgba(224,96,58,.12);color:var(--accent-deep);border-color:var(--accent-deep);}
  .badge.pos{background:transparent;color:var(--muted);border-color:var(--muted);font-style:italic;font-family:'Fraunces',serif;}

  .word{font-size:clamp(38px,9vw,64px);font-weight:900;line-height:1.02;letter-spacing:-1px;word-break:break-word;}
  .gloss{margin-top:8px;font-size:18px;color:var(--muted);font-style:italic;min-height:24px;}
  .gloss.hidden{visibility:hidden;}
  .placeholder{font-size:22px;color:#9a8d7b;font-style:italic;font-weight:400;}

  /* ---------- 脚手架 ---------- */
  .scaffold{width:100%;margin-top:20px;text-align:left;border-top:2px dashed rgba(43,37,32,.18);padding-top:16px;}
  .scaffold.hidden{display:none;}
  .sc-block{margin-bottom:12px;}
  .sc-title{
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--teal);margin-bottom:5px;display:flex;align-items:center;gap:5px;
  }
  .frames{list-style:none;display:flex;flex-direction:column;gap:5px;}
  .frames li{font-size:16px;line-height:1.4;padding-left:16px;position:relative;}
  .frames li::before{content:"›";position:absolute;left:0;color:var(--accent);font-weight:700;}
  .frames b{color:var(--accent-deep);font-style:italic;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{
    font-size:13px;font-family:'Space Mono',monospace;padding:3px 9px;border-radius:6px;
    background:rgba(31,107,92,.1);color:var(--teal);
  }
  .tag.taboo{background:rgba(224,96,58,.12);color:var(--accent-deep);text-decoration:line-through;}
  .reveal-def{
    margin-top:4px;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;
    background:none;border:none;color:var(--accent-deep);text-decoration:underline;padding:0;
  }
  .def{margin-top:6px;font-size:15px;color:var(--ink);font-style:italic;
    background:rgba(255,240,225,.7);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;}
  .def.hidden{display:none;}

  /* ---------- 控制区 ---------- */
  .controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px;}
  button.act{
    font-family:'Fraunces',serif;font-weight:600;font-size:18px;cursor:pointer;
    border:3px solid var(--ink);border-radius:14px;padding:13px 26px;background:var(--accent);
    color:#fff;box-shadow:4px 5px 0 var(--ink);transition:all .1s ease;
  }
  button.act:hover{transform:translate(-2px,-2px);box-shadow:6px 7px 0 var(--ink);}
  button.act:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink);}
  button.act.ghost{background:var(--card);color:var(--ink);}
  button.act:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:4px 5px 0 var(--ink);}

  .meta{
    display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center;
    margin-top:22px;font-family:'Space Mono',monospace;font-size:13px;color:var(--muted);
  }
  .meta b{color:var(--ink);font-size:15px;}
  .toggle{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;}
  .toggle input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .reset{background:none;border:none;color:var(--accent-deep);cursor:pointer;
    font-family:'Space Mono',monospace;font-size:13px;text-decoration:underline;}
  .bankinfo{
    margin-top:14px;font-family:'Space Mono',monospace;font-size:11px;color:#a99a86;
    letter-spacing:.05em;text-align:center;
  }
  .bankinfo .net{color:var(--teal);}
  .hint{margin-top:8px;font-family:'Space Mono',monospace;font-size:11px;color:#a99a86;letter-spacing:.05em;text-align:center;}
</style>
</head>
<body>
  <header>
    <h1>口语抽词器 <span class="en">Taboo</span></h1>
    <div class="sub">描述这个词，但不能说出它本身</div>
  </header>

  <div class="filters">
    <div class="filter-row" id="themeRow">
      <span class="filter-label">主题</span>
    </div>
    <div class="filter-row" id="levelRow">
      <span class="filter-label">难度</span>
    </div>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="badges" id="badges"></div>
      <div class="word placeholder" id="word">选好主题 / 难度，点下方开始</div>
      <div class="gloss hidden" id="gloss"></div>
      <div class="scaffold hidden" id="scaffold"></div>
    </div>
  </div>

  <div class="controls">
    <button class="act" id="draw">抽一个词</button>
    <button class="act ghost" id="pass" disabled>换一个 / Pass</button>
  </div>

  <div class="meta">
    <span>进度 <b id="count">0 / 0</b></span>
    <label class="toggle"><input type="checkbox" id="scaffoldToggle" checked> 显示英文脚手架</label>
    <label class="toggle"><input type="checkbox" id="glossToggle"> 显示中文</label>
    <button class="reset" id="reset">重置牌堆</button>
  </div>

  <div class="bankinfo" id="bankinfo"></div>
  <div class="hint">提示：按 [空格] 抽词 · 脚手架里的 <b>___</b> 需要你自己补上 · 划掉的是禁忌词，不能说</div>

nt","zh":"折扣","theme":"office","level":"A2","pos":"noun","frames":["The shop cuts the price, so I pay ___.","This shirt was 100 dollars, but today it's only ___."],"colloc":["lower price","special offer","save money","coupon"],"taboo":["sale","cheap","percent","off"],"def":"Money taken off the normal price of something."},{"en":"interview","zh":"面试","theme":"office","level":"A2","pos":"noun","frames":["Before the company chose me, I had a formal talk with the ___.","I wore a suit and tried to make a good first ___."],"colloc":["answer well","wear a suit","prepare","first impression"],"taboo":["job","questions","hire","resume"],"def":"A formal talk where a company decides whether to give you the job."},{"en":"meeting","zh":"会议","theme":"office","level":"A2","pos":"noun","frames":["It's when people sit together to ___ something.","Your boss calls one when there's a lot to ___."],"colloc":["room","discuss","everyone","agenda"],"taboo":["talk","room","discuss"],"def":"when a group of people gather to discuss work"},{"en":"office","zh":"办公室","theme":"office","level":"A2","pos":"noun","frames":["I go to this place every weekday from nine to ___.","People type on computers and have meetings in this ___."],"colloc":["computer","chair","nine to five","quiet"],"taboo":["desk","building","room","work"],"def":"A room or building where people do their jobs at desks."},{"en":"password","zh":"密码","theme":"office","level":"A2","pos":"noun","frames":["I type this before I can open my ___.","Never share this with others, or they can read your ___."],"colloc":["type","forget","reset","sign in"],"taboo":["secret","code","login","account"],"def":"Secret letters and numbers you type to enter your account."},{"en":"receipt","zh":"收据","theme":"office","level":"A2","pos":"noun","frames":["The cashier gives me this small thing to show I ___.","Keep this so you can return the item and get your money ___."],"colloc":["keep it","print","show","after paying"],"taboo":["paper","proof","bill","inv ,{"en":"upgrade","zh":"升级","theme":"office","level":"B1","pos":"verb","frames":["I changed my old phone for the latest ___.","The airline moved me from economy to business ___."],"colloc":["software","new model","business class","system"],"taboo":["better","newer","version","improve"],"def":"To change something for a newer, better version."},{"en":"agenda","zh":"议程","theme":"office","level":"B2","pos":"noun","frames":["We follow this paper point by point during our morning ___.","This paper shows what we will talk about and in what ___."],"colloc":["first point","in order","discuss","prepare"],"taboo":["meeting","topics","items","list"],"def":"A list of things to discuss at a meeting, in order."},{"en":"allowance","zh":"津贴","theme":"office","level":"B2","pos":"noun","frames":["Besides my pay, the company gives me money each month for ___.","Parents give children a little money every week to buy ___."],"colloc":["each month","for travel","on top of salary","meals"],"taboo":["pocket money","extra","benefit","subsidy"],"def":"Money given regularly for a special purpose, like travel or meals."},{"en":"commute","zh":"通勤","theme":"office","level":"B2","pos":"verb","frames":["Every morning I spend one hour going from home to the ___.","I moved closer to the company, so this daily trip takes only ___."],"colloc":["home to office","every morning","one hour","train"],"taboo":["travel","traffic","subway","rush hour"],"def":"To travel regularly between your home and your place of work."},{"en":"internship","zh":"实习","theme":"office","level":"B2","pos":"noun","frames":["Before graduating, many young people join a company for a few ___.","The pay is low, but afterward you might get a full-time ___."],"colloc":["three months","learn a lot","company","full-time offer"],"taboo":["student","summer","experience","trainee"],"def":"A short period when a student works at a company to learn."},{"en":"invoice","zh":"发票","theme":"office","level":"B2","pos":"noun","frames":["After finishing   //__EMBEDDED_END__

  function validBank(b){
    return b && typeof b.version === "string" && b.themes &&
           Array.isArray(b.words) && b.words.length > 0;
  }

  let BANK = EMBEDDED;
  try{
    const cached = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if(validBank(cached) && cached.version > BANK.version) BANK = cached;
  }catch(e){}

  /* ============================================================
     状态
     ============================================================ */
  const LEVELS = ["A2","B1","B2"];
  let activeTheme = "all";
  let activeLevel = "all";
  let pool = [];
  let drawnCount = 0;
  let filteredTotal = 0;
  let pendingBank = null;   // 拉到新词库但正在玩 → 暂存，重置时生效

  const wordEl = document.getElementById('word');
  const glossEl = document.getElementById('gloss');
  const badgesEl = document.getElementById('badges');
  const scaffoldEl = document.getElementById('scaffold');
  const cardEl = document.getElementById('card');
  const countEl = document.getElementById('count');
  const drawBtn = document.getElementById('draw');
  const passBtn = document.getElementById('pass');
  const bankinfoEl = document.getElementById('bankinfo');
  const scaffoldToggle = document.getElementById('scaffoldToggle');
  const glossToggle = document.getElementById('glossToggle');

  let netStatus = "";
  function setNet(s){ netStatus = s; renderBankInfo(); }
  function renderBankInfo(){
    const base = validBank(BANK) ? ("词库 v" + BANK.version + " · " + BANK.words.length + " 词") : "内嵌词库为空";
    bankinfoEl.innerHTML = escapeHtml(base) + (netStatus ? ' · <span class="net">' + escapeHtml(netStatus) + '</span>' : "");
  }

  /* ---------- 筛选栏（随词库动态生成） ---------- */
  function buildFilters(){
    const themeRow = document.getElementById('themeRow');
    const levelRow = document.getElementById('levelRow');
    [...themeRow.querySelectorAll('.chip')].forEach(c=>c.remove());
    [...levelRow.querySelectorAll('.chip')].forEach(c=>c.remove());

    const allThemeChip = chip("全部", activeTheme==="all", ()=>selectTheme("all", allThemeChip, themeRow));
    themeRow.appendChild(allThemeChip);
    Object.keys(BANK.themes || {}).forEach(key=>{
      const c = chip(BANK.themes[key].label, activeTheme===key, ()=>selectTheme(key, c, themeRow));
      themeRow.appendChild(c);
    });

    const allLvlChip = chip("全部", activeLevel==="all", ()=>selectLevel("all", allLvlChip, levelRow), true);
    levelRow.appendChild(allLvlChip);
    LEVELS.forEach(lv=>{
      const c = chip(lvLabel(lv), activeLevel===lv, ()=>selectLevel(lv, c, levelRow), true);
      levelRow.appendChild(c);
    });
  }
  function lvLabel(lv){ return {A2:"A2 入门",B1:"B1 进阶",B2:"B2 挑战"}[lv] || lv; }
  function chip(text, on, onClick, isLevel){
    const el = document.createElement('span');
    el.className = "chip" + (isLevel?" lvl":"") + (on?" on":"");
    el.textContent = text;
    el.addEventListener('click', onClick);
    return el;
  }
  function selectTheme(key, el, row){
    activeTheme = key;
    [...row.querySelectorAll('.chip')].forEach(c=>c.classList.remove('on'));
    el.classList.add('on');
    resetDeck();
  }
  function selectLevel(lv, el, row){
    activeLevel = lv;
    [...row.querySelectorAll('.chip')].forEach(c=>c.classList.remove('on'));
    el.classList.add('on');
    resetDeck();
  }

  /* ---------- 牌堆 ---------- */
  function currentFilterWords(){
    return (BANK.words || []).filter(w =>
      (activeTheme==="all" || w.theme===activeTheme) &&
      (activeLevel==="all" || w.level===activeLevel)
    );
  }
  function resetDeck(){
    pool = currentFilterWords().slice();
    filteredTotal = pool.length;
    drawnCount = 0;
    updateCount();
    resetDisplay();
  }
  function updateCount(){ countEl.textContent = drawnCount + " / " + filteredTotal; }

  function resetDisplay(){
    badgesEl.innerHTML = "";
    wordEl.className = "word placeholder";
    wordEl.textContent = !validBank(BANK)
      ? "词库加载中… 若一直如此请检查网络"
      : (filteredTotal === 0
          ? "这个组合下暂时没有词，换个筛选试试"
          : "选好了，点「抽一个词」开始");
    glossEl.classList.add('hidden');
    scaffoldEl.classList.add('hidden');
    scaffoldEl.innerHTML = "";
    drawBtn.disabled = filteredTotal === 0;
    passBtn.disabled = true;
  }

  /* ---------- 抽词 ---------- */
  function shuffleDraw(){
    if(pool.length === 0){
      badgesEl.innerHTML = "";
      wordEl.className = "word placeholder";
      wordEl.textContent = "这一堆抽空了 🎉 点「重置牌堆」再来";
      glossEl.classList.add('hidden');
      scaffoldEl.classList.add('hidden');
      drawBtn.disabled = true;
      passBtn.disabled = true;
      return;
    }
    const i = Math.floor(Math.random()*pool.length);
    const w = pool.splice(i,1)[0];
    drawnCount++;
    updateCount();
    renderWord(w);
    cardEl.classList.remove('pop'); void cardEl.offsetWidth; cardEl.classList.add('pop');
    passBtn.disabled = false;
  }

  function renderWord(w){
    badgesEl.innerHTML = "";
    const theme = (BANK.themes || {})[w.theme];
    if(theme) badgesEl.appendChild(mkBadge(theme.label, "theme"));
    badgesEl.appendChild(mkBadge(w.level, "lvl"));
    badgesEl.appendChild(mkBadge(w.pos, "pos"));

    wordEl.className = "word";
    wordEl.textContent = w.en;
    glossEl.textContent = w.zh;
    glossEl.classList.toggle('hidden', !glossToggle.checked);

    scaffoldEl.innerHTML = "";
    if(w.frames && w.frames.length) scaffoldEl.appendChild(scBlock("💬 试着这样开口", framesList(w.frames)));
    if(w.colloc && w.colloc.length) scaffoldEl.appendChild(scBlock("🧩 也许用得上", tagList(w.colloc, false)));
    if(w.taboo && w.taboo.length) scaffoldEl.appendChild(scBlock("🚫 但不能说", tagList(w.taboo, true)));
    if(w.def) scaffoldEl.appendChild(defBlock(w.def));
    scaffoldEl.classList.toggle('hidden', !scaffoldToggle.checked);
  }

  function mkBadge(text, cls){
    const b = document.createElement('span');
    b.className = "badge " + cls;
    b.textContent = text;
    return b;
  }
  function scBlock(title, contentNode){
    const wrap = document.createElement('div');
    wrap.className = "sc-block";
    const t = document.createElement('div');
    t.className = "sc-title";
    t.textContent = title;
    wrap.appendChild(t);
    wrap.appendChild(contentNode);
    return wrap;
  }
  function framesList(frames){
    const ul = document.createElement('ul');
    ul.className = "frames";
    frames.forEach(f=>{
      const li = document.createElement('li');
      li.innerHTML = escapeHtml(f).replace(/___+/g, '<b>___</b>');
      ul.appendChild(li);
    });
    return ul;
  }
  function tagList(items, isTaboo){
    const wrap = document.createElement('div');
    wrap.className = "tags";
    items.forEach(it=>{
      const t = document.createElement('span');
      t.className = "tag" + (isTaboo?" taboo":"");
      t.textContent = it;
      wrap.appendChild(t);
    });
    return wrap;
  }
  function defBlock(def){
    const wrap = document.createElement('div');
    wrap.className = "sc-block";
    const btn = document.createElement('button');
    btn.className = "reveal-def";
    btn.textContent = "看不出来？瞄一眼英文定义";
    const d = document.createElement('div');
    d.className = "def hidden";
    d.textContent = def;
    btn.addEventListener('click', ()=>{
      d.classList.toggle('hidden');
      btn.textContent = d.classList.contains('hidden') ? "看不出来？瞄一眼英文定义" : "收起定义";
    });
    wrap.appendChild(btn);
    wrap.appendChild(d);
    return wrap;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------- 联网更新 ---------- */
  function applyBank(b){
    BANK = b;
    activeTheme = "all";
    activeLevel = "all";
    buildFilters();
    resetDeck();
    renderBankInfo();
  }
  function checkUpdate(){
    if(!/^https?:/.test(WORDS_URL)){ setNet("本地模式"); return; }
    fetch(WORDS_URL, {cache:"no-store"})
      .then(r => r.ok ? r.json() : null)
      .then(remote => {
        if(!validBank(remote)){ setNet("词库源异常 · 使用本地词库"); return; }
        if(remote.version > BANK.version){
          try{ localStorage.setItem(LS_KEY, JSON.stringify(remote)); }catch(e){}
          if(drawnCount === 0){ applyBank(remote); setNet("已联网更新"); }
          else { pendingBank = remote; setNet("有新词库 · 重置牌堆后生效"); }
        } else {
          setNet("已是最新");
        }
      })
      .catch(()=> setNet("离线 · 使用本地词库"));
  }

  /* ---------- 事件 ---------- */
  drawBtn.addEventListener('click', shuffleDraw);
  passBtn.addEventListener('click', shuffleDraw);
  document.getElementById('reset').addEventListener('click', function(){
    if(pendingBank){
      const b = pendingBank; pendingBank = null;
      applyBank(b);
      setNet("已更新到 v" + b.version);
    } else {
      resetDeck();
    }
  });

  glossToggle.addEventListener('change', function(e){
    if(wordEl.classList.contains('placeholder')) return;
    glossEl.classList.toggle('hidden', !e.target.checked);
  });
  scaffoldToggle.addEventListener('change', function(e){
    if(wordEl.classList.contains('placeholder')) return;
    scaffoldEl.classList.toggle('hidden', !e.target.checked);
  });

  document.addEventListener('keydown', function(e){
    if(e.code === "Space"){ e.preventDefault(); if(!drawBtn.disabled) shuffleDraw(); }
  });

  /* ---------- 启动 ---------- */
  buildFilters();
  resetDeck();
  renderBankInfo();
  checkUpdate();
</script>
</body>
</html>
